name: Manter Streamlit Acordado (Keep-Alive)

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    # Impede que o Streamlit entre em modo de sono após 12h de inatividade
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Executar Despertador do Streamlit
        run: |
          python scripts/wake_streamlit.py https://gestaoorcamentaria.streamlit.app
