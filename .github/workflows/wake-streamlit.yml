name: Manter Streamlit Acordado (Keep-Alive)

on:
  schedule:
    # Executa a cada 6 horas (00:00, 06:00, 12:00, 18:00 UTC)
    # Impede que o Streamlit entre em modo de sono após 12h de inatividade
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  wake-streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Acordar Streamlit via Headless Browser (Puppeteer/Chromium)
        uses: gpenessot/streamlit-keep-alive@v1
        with:
          app-urls: |
            https://gestaoorcamentaria.streamlit.app
